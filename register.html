<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FoodBank | Join Our Community</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Shared CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Minimal Brand Navigation -->
  <header class="py-3 main-navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <div class="brand-icon-box">
          <i class="fa-solid fa-hand-holding-heart"></i>
        </div>
        <span>FOOD<span class="brand-accent-text">BANK</span></span>
      </a>
      <a href="login.html" class="btn btn-sm btn-food-outline">
        <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Already registered? Sign In
      </a>
    </div>
  </header>

  <!-- Register Container -->
  <main class="auth-wrapper py-5">
    <div class="auth-card" style="max-width: 600px;">
      <div class="text-center mb-4">
        <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Create FoodBank Account</h3>
        <p class="text-muted small">Join thousands saving food and supporting hungry families across your city</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        <div class="row g-3">

          <!-- Full Name -->
          <div class="col-12">
            <label class="form-label" for="regFullName">Full Name / Organization Name <span class="text-danger">*</span></label>
            <div class="input-icon-group">
              <i class="fa-regular fa-user"></i>
              <input type="text" class="form-control" id="regFullName" placeholder="Rahul Sharma" required>
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label" for="regEmail">Email Address <span class="text-danger">*</span></label>
            <div class="input-icon-group">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" class="form-control" id="regEmail" placeholder="rahul@example.com" required>
            </div>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <label class="form-label" for="regPhone">Phone Number <span class="text-danger">*</span></label>
            <div class="input-icon-group">
              <i class="fa-solid fa-phone"></i>
              <input type="tel" class="form-control" id="regPhone" placeholder="+91 98765 43210" required>
            </div>
          </div>

          <!-- Account Type -->
          <div class="col-12">
            <label class="form-label" for="regAccountType">Account Type <span class="text-danger">*</span></label>
            <select class="form-select" id="regAccountType" required>
              <option value="donor" selected>Individual Food Donor</option>
              <option value="restaurant">Restaurant / Caterer / Hotel</option>
              <option value="ngo">NGO / Non-Profit Shelter</option>
              <option value="volunteer">Community Volunteer</option>
            </select>
          </div>

          <!-- City -->
          <div class="col-md-6">
            <label class="form-label" for="regCity">City <span class="text-danger">*</span></label>
            <select class="form-select" id="regCity" required>
              <option value="Vadodara" selected>Vadodara</option>
              <option value="Ahmedabad">Ahmedabad</option>
              <option value="Surat">Surat</option>
              <option value="Rajkot">Rajkot</option>
              <option value="Gandhinagar">Gandhinagar</option>
            </select>
          </div>

          <!-- Pincode / Area -->
          <div class="col-md-6">
            <label class="form-label" for="regAddress">Address <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="regAddress" placeholder="Street, Flat/Building" required>
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <label class="form-label" for="regPassword">Password <span class="text-danger">*</span></label>
            <div class="input-icon-group position-relative">
              <i class="fa-solid fa-lock"></i>
              <input type="password" class="form-control" id="regPassword" placeholder="Minimum 6 characters" required>
              <button type="button" class="btn btn-sm text-muted position-absolute end-0 top-50 translate-middle-y me-2 border-0 toggle-password" data-target="regPassword">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6">
            <label class="form-label" for="regConfirmPassword">Confirm Password <span class="text-danger">*</span></label>
            <div class="input-icon-group position-relative">
              <i class="fa-solid fa-lock"></i>
              <input type="password" class="form-control" id="regConfirmPassword" placeholder="Repeat password" required>
              <button type="button" class="btn btn-sm text-muted position-absolute end-0 top-50 translate-middle-y me-2 border-0 toggle-password" data-target="regConfirmPassword">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

        </div>

        <div class="form-check mt-3 mb-4">
          <input class="form-check-input" type="checkbox" id="regTerms" required checked>
          <label class="form-check-label small text-muted" for="regTerms">
            I agree to the Food Safety Charter and Terms of Service.
          </label>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-food-primary btn-lg shadow-sm">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </div>

        <div class="text-center">
          <span class="small text-muted">Already have an account?</span>
          <a href="login.html" class="small fw-bold text-success ms-1">Login here</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared JS -->
  <script src="js/script.js"></script>
</body>
</html>
