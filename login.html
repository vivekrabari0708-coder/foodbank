<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoodBank | Sign in to Your Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Shared CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Minimal Brand Navigation -->
  <header class="py-3 main-navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <div class="brand-icon-box">
          <i class="fa-solid fa-hand-holding-heart"></i>
        </div>
        <span>FOOD<span class="brand-accent-text">BANK</span></span>
      </a>
      <a href="index.html" class="btn btn-sm btn-food-outline">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Website
      </a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
        <p class="text-muted small">Sign in to manage your food donations and requests</p>
      </div>

      <!-- Role Switcher: Donor vs NGO/Volunteer -->
      <div class="auth-tabs-toggle">
        <button type="button" class="auth-tab-btn active" data-role="donor">
          <i class="fa-solid fa-user me-1"></i> Continue as Donor
        </button>
        <button type="button" class="auth-tab-btn" data-role="ngo">
          <i class="fa-solid fa-handshake-angle me-1"></i> Continue as NGO
        </button>
      </div>

      <div class="p-2 mb-3 bg-light rounded-3 text-center small" id="authRoleNotice">
        <i class="fa-solid fa-heart text-success me-1"></i> Logging in as compassionate <strong>Food Donor</strong>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <!-- Email Field -->
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" value="rahul.donor@foodbank.org" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label mb-0" for="loginPassword">Password</label>
            <a href="#" class="small text-success" onclick="alert('Password reset link sent to demo email!'); return false;">Forgot?</a>
          </div>
          <div class="input-icon-group position-relative">
            <i class="fa-solid fa-key"></i>
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" value="demo1234" required>
            <button type="button" class="btn btn-sm text-muted position-absolute end-0 top-50 translate-middle-y me-2 border-0 toggle-password" data-target="loginPassword">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-muted" for="rememberMe">
            Remember me on this browser
          </label>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-food-primary btn-lg shadow-sm">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
          </button>
        </div>

        <div class="text-center">
          <span class="small text-muted">Don’t have an account yet?</span>
          <a href="register.html" class="small fw-bold text-success ms-1">Create Account</a>
        </div>
      </form>

      <!-- Quick Demo Credentials Box for Evaluation -->
      <div class="mt-4 pt-3 border-top text-center">
        <span class="badge bg-light text-muted border px-2 py-1 small">
          <i class="fa-solid fa-circle-info text-primary me-1"></i> Demo Ready: Click <strong>Login</strong> to explore Dashboard
        </span>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared JS -->
  <script src="js/script.js"></script>
</body>
</html>
